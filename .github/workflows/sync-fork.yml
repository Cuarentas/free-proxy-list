name: Sync Fork from Upstream

# 触发条件
on:
  # 定时任务：每天北京时间 03:00 执行（UTC 19:00）
  schedule:
    - cron: '0 19 * * *'
  # 支持手动在 Actions 页面点击运行
  workflow_dispatch:

# 权限设置
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current fork repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整提交历史，保证合并正常

      - name: Set git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add upstream remote
        run: |
          # ========== 修改这里为【上游仓库】地址 ==========
          git remote add upstream https://github.com/proxifly/free-proxy-list.git
          git fetch upstream

      - name: Sync upstream main branch to fork
        run: |
          # 同步上游 main 分支到本地，再推送到 fork 的 main
          git checkout main
          git merge upstream/main --no-ff -m "chore: sync from upstream"

      - name: Push to fork repository
        run: |
          git push origin main
