name: Sync Fork Upstream
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Git config
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/proxifly/free-proxy-list.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check and sync
        run: |
          git checkout main
          if git diff --quiet main upstream/main; then
            echo "✅ Upstream no new commits, skip sync"
            exit 0
          fi
          echo "🔔 Found new commits, start merge"
          git merge upstream/main --no-ff -m "chore: auto sync from upstream"
          git push origin main
